<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Postos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna por posto; % grande no topo, detalhe por baixo. Leitura à distância. */
:root {
  --bg: #04080f;
  --bg-col: rgba(0,15,40,0.5);
  --line: rgba(255,255,255,0.12);
  --fg: #ffffff;
  --fg-dim: rgba(255,255,255,0.72);
  --fg-faint: rgba(255,255,255,0.42);
  --green: #00ff87;
  --cyan: #00d4ff;
  --amber: #ffaa00;
  --red: #ff3b3b;
  --display: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(circle at center, rgba(81,184,234,1) 0%, rgba(0,0,0,1) 100%);
  background-attachment: fixed;
  background-color: #000;
  color: var(--fg);
  font-family: var(--body);
  overflow-x: hidden;
}
.shell { height: 100%; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; position: relative; }

/* Textura de fundo igual ao painel original */
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 48px 48px; }
.bg-glow-left { position: fixed; left: -200px; top: 20%; width: 600px; height: 600px; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%); }
.bg-glow-right { position: fixed; right: -100px; bottom: 10%; width: 500px; height: 500px; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, rgba(0,80,120,0.15) 0%, transparent 70%); }
.top-accent { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0.6) 70%, transparent); }
header, footer, main { position: relative; z-index: 2; }

header, footer {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px clamp(16px, 2.5vw, 40px);
  backdrop-filter: blur(12px);
  background: rgba(0,20,40,0.35);
  border-color: var(--line); border-style: solid; border-width: 0;
}
header { border-bottom-width: 1px; }
footer { border-top-width: 1px; }
.brand img { display: block; height: clamp(24px, 3.4vh, 38px); width: auto; max-width: 32vw; object-fit: contain; }
.title { font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: var(--fg-dim); font-size: clamp(14px, 2vh, 20px); text-align: center; }
.clock { font-size: clamp(16px, 2.4vh, 24px); letter-spacing: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.src { font-size: clamp(12px, 1.6vh, 15px); letter-spacing: 3px; text-transform: uppercase; color: var(--fg-dim); display: flex; align-items: center; gap: 10px; }
.src i { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); display: inline-block; }
.src.live i { background: var(--green); box-shadow: 0 0 10px var(--green); }

main {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  min-height: 0;
}
.col {
  container-type: inline-size;
  display: grid; grid-template-rows: 1fr auto 1fr; grid-template-columns: minmax(0, 1fr);
  min-width: 0; min-height: 0;
  padding: clamp(12px, 2vh, 24px) clamp(14px, 6cqw, 28px);
  border-left: 1px solid var(--line);
  background: var(--bg-col);
  gap: clamp(8px, 2.4vh, 60px);
}
.col:first-child { border-left: 0; }

.posto-head { align-self: start; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.posto { font-family: var(--display); font-size: min(12cqw, 5.6vh); letter-spacing: 3px; line-height: 1; }
.pill {
  font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  font-size: min(5cqw, 2.4vh);
  padding: .15em .6em; border: 2px solid currentColor; border-radius: 999px; white-space: nowrap;
}
.pill.on { color: var(--green); }
.pill.off { color: var(--fg-faint); }

/* Bloco principal (%, lote, prazo): centrado na altura da coluna */
.focus { display: grid; gap: clamp(8px, 2.4vh, 60px); min-width: 0; }

/* 1.º foco: % de realização — ocupa a largura toda da coluna */
.pct {
  font-family: var(--display); line-height: .8; letter-spacing: -.01em;
  font-size: min(58cqw, 34vh);
  font-variant-numeric: tabular-nums;
  text-align: center; white-space: nowrap;
  padding-top: .04em;
  text-shadow: 0 .03em .12em rgba(0,0,0,.55);
}
.pct small { font-size: .4em; letter-spacing: 0; margin-left: .04em; }
.big-bar { height: min(3cqw, 1.4vh); background: rgba(0,0,0,0.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); border-radius: 999px; overflow: hidden; }
.big-bar > div { height: 100%; border-radius: 999px; transition: width .6s ease; }

/* 2.º foco: nome do lote */
.model { text-align: center; text-shadow: 0 .03em .12em rgba(0,0,0,.55); }
.model .m { font-family: var(--display); font-size: min(16cqw, 7.4vh); letter-spacing: .02em; line-height: .95; overflow-wrap: anywhere; text-wrap: balance; }
.model .l { font-family: var(--display); font-size: min(16cqw, 7.4vh); letter-spacing: .02em; line-height: .95; margin-top: .12em; }
.model .l span { font-family: var(--body); font-weight: 700; font-size: .36em; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-dim); vertical-align: middle; margin-right: .5em; }
.model .l.none { color: var(--fg-faint); font-size: min(9cqw, 4vh); }

/* 3.º foco: barra do prazo */
.prazo { display: grid; gap: min(2cqw, 1vh); }
.prazo .k { font-size: min(6.5cqw, 3vh); color: var(--fg-dim); }
.prazo .big-bar { height: min(11cqw, 5vh); }

/* Secundário: prioridades, no fundo da coluna */
.secondary { align-self: end; display: grid; gap: min(3cqw, 1.4vh); border-top: 1px solid var(--line); padding-top: min(4cqw, 1.8vh); }
.k { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-dim); font-size: min(4.8cqw, 2.2vh); }
.priority-focus { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: min(4cqw, 1.8vh); }
.pie {
  width: min(21cqw, 9.5vh); aspect-ratio: 1; border-radius: 50%;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(0,0,0,0.45) 0);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
}
.priority-focus .name { display: grid; gap: 2px; min-width: 0; }
.priority-focus .task { font-family: var(--display); font-size: min(12cqw, 5.4vh); line-height: 1; letter-spacing: .02em; overflow-wrap: anywhere; }
.priority-focus .value { font-family: var(--display); font-size: min(15cqw, 6.8vh); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.priority-focus .value small { font-size: .55em; }
.next-priority { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.next-priority .value { font-family: var(--display); font-size: min(12cqw, 5.4vh); line-height: 1; letter-spacing: .02em; overflow-wrap: anywhere; text-align: right; }

.zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(6px, 1.2vh, 14px); border-top: 1px solid var(--line); padding-top: clamp(8px, 1.6vh, 18px); }
.zone { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; align-items: baseline; }
.zone .n { font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--fg-dim); font-size: clamp(8px, calc(5.2cqw - 5px), 19px); }
.zone .v { font-family: var(--display); font-size: clamp(19px, calc(9cqw - 5px), 41px); line-height: 1; font-variant-numeric: tabular-nums; }
.zone .b { grid-column: 1 / -1; height: clamp(5px, .9vh, 9px); background: rgba(255,255,255,0.12); border-radius: 5px; overflow: hidden; }
.zone .b > div { height: 100%; border-radius: 5px; transition: width .6s ease; }

.prazo .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prazo .num { font-family: var(--display); font-size: clamp(30px, 11cqw, 56px); line-height: 1; font-variant-numeric: tabular-nums; }
.prazo .num span { color: var(--fg-faint); font-size: .6em; }
.prazo .rest { font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: clamp(14px, 5.4cqw, 26px); text-align: right; }
.dates { display: flex; justify-content: space-between; gap: 8px; color: var(--fg-dim); font-size: clamp(13px, 4.6cqw, 22px); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.priority-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
.done-priorities { border-top: 1px solid var(--line); padding-top: clamp(8px, 1.6vh, 18px); display: grid; gap: 6px; }
.done-priorities .items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px 10px; }
.done-priority { display: flex; justify-content: space-between; gap: 4px; color: var(--fg-dim); font-size: clamp(12px, 4.3cqw, 17px); font-variant-numeric: tabular-nums; }
.done-priority strong { color: var(--fg); }
.done-priority.empty { color: var(--fg-faint); }

@media (max-width: 1200px) {
  main { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .col:nth-child(3n + 1) { border-left: 0; }
}

@media (max-width: 1000px) {
  html, body { height: auto; }
  .shell { height: auto; }
  main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col { border-top: 1px solid var(--line); }
  .col:nth-child(odd) { border-left: 0; }
  .title { display: none; }
}
@media (max-width: 520px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .col { border-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .big-bar > div, .zone .b > div { transition: none; } }
</style>
</head>
<body>


<div class="top-accent"></div>
<div class="bg-grid"></div>
<div class="bg-glow-left"></div>
<div class="bg-glow-right"></div>
<div class="shell">
  <header>
    <div class="brand"><img src="https://res.cloudinary.com/dlkkjtgvy/image/upload/v1780388780/somengil_logo_white_ofh0xi.png" alt="Somengil"></div>
    <div class="title">Soldadura · Progresso por Posto</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <main id="postos"></main>
  <footer>
    <div class="src" id="src"><i></i><span id="srcTxt">A carregar…</span></div>
    <div class="clock" id="date">—</div>
  </footer>
</div>

<script>
const SHEET_ID = '1GQUB52a2gKR429bjqJrNkbP5rjR7Z_4v85z9M7_Cr8Y';
const POLL_MS = 20000;
const POSTOS = [
  { tab: 'PS1', nome: 'Posto 1' },
  { tab: 'PS2', nome: 'Posto 2' },
  { tab: 'PS3', nome: 'Posto 3' },
  { tab: 'PS5', nome: 'Posto 5' },
];
// Colunas lidas em cada separador (linha 2 da folha). Iguais às do painel PS1 original.
const COLS = {
  chave: 'A', modeloLote: 'D', previsto: 'F', inicio: 'J',
  cuba: 'O', estrutura: 'P', interior: 'Q', envolventes: 'R',
  geral: 'AK', proxima: 'CH',
};
const PRIORIDADE_COLS = { PS1: 'CI', PS2: 'CJ', PS3: 'CK', PS4: 'CL', PS5: 'CM' };
const ZONAS = [];

/* ── helpers ── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colIdx = l => [...l.toUpperCase()].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
const colorFor = v => v >= 75 ? 'var(--green)' : v >= 40 ? 'var(--cyan)' : 'var(--amber)';
const barColor = v => v === 100 ? 'var(--green)' : v > 0 ? 'var(--cyan)' : 'transparent';

function parsePct(v) {
  if (v == null || String(v).trim() === '') return null;
  if (typeof v === 'number') return Math.round(Math.abs(v) <= 1 ? v * 100 : v);
  const m = String(v).replace(/\s+/g, '').replace(',', '.').match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  const n = Number(m[0]);
  return Math.round(n <= 1 && !String(v).includes('%') ? n * 100 : n);
}
function parseDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  const m = String(v).match(/Date\((\d+),(\d+),(\d+)/);
  if (m) return new Date(+m[1], +m[2], +m[3]);
  const d = new Date(String(v));
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
const fmtDate = d => d ? d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, ' / ') : '-- / -- / ----';

/* ── dias úteis em Portugal ── */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const holidayCache = {};
function holidays(y) {
  if (holidayCache[y]) return holidayCache[y];
  const e = easter(y), add = n => { const d = new Date(e); d.setDate(d.getDate() + n); return d; };
  const fixed = [[0,1],[3,25],[4,1],[5,10],[7,15],[9,5],[10,1],[11,1],[11,8],[11,25]];
  const set = new Set(fixed.map(([m, d]) => `${m}-${d}`));
  [add(-47), add(-2), add(0), add(60)].forEach(d => set.add(`${d.getMonth()}-${d.getDate()}`));
  return (holidayCache[y] = set);
}
function isWorkDay(d) {
  const w = d.getDay();
  return w >= 1 && w <= 5 && !holidays(d.getFullYear()).has(`${d.getMonth()}-${d.getDate()}`);
}
function workDays(from, to, includeFrom = true) {
  const cur = new Date(from); if (!includeFrom) cur.setDate(cur.getDate() + 1);
  let n = 0;
  while (cur <= to) { if (isWorkDay(cur)) n++; cur.setDate(cur.getDate() + 1); }
  return n;
}

/* ── dados ── */
async function loadPosto(tab) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&headers=1`;
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  const text = await res.text();
  const m = text.match(/setResponse\((.*)\);?\s*$/s);
  if (!m) throw new Error('formato inválido');
  const table = JSON.parse(m[1]).table;
  const row = table.rows[0];
  if (!row) throw new Error('sem linhas');
  const get = key => { const col = key === 'prioridade' ? PRIORIDADE_COLS[tab] : COLS[key]; const c = row.c[colIdx(col)]; return c ? (c.v != null ? c.v : c.f != null ? c.f : null) : null; };
  const postoId = Number(tab.slice(2));
  const prioridadesRealizadas = [];
  for (let i = colIdx('AL'); i <= colIdx('CE'); i += 2) {
    const assigned = row.c[i];
    const assignedTo = assigned && (assigned.v != null ? assigned.v : assigned.f);
    if (assignedTo == null || String(assignedTo).trim() === '' || Number(assignedTo) !== postoId) continue;
    const percent = row.c[i + 1];
    prioridadesRealizadas.push({
      nome: table.cols[i].label,
      percentagem: parsePct(percent ? (percent.v != null ? percent.v : percent.f) : null),
    });
  }
  const ml = String(get('modeloLote') || '').trim();
  const mm = ml.match(/^(.*?)\s*-\s*(\d{2}L)$/);
  const txt = k => { const v = get(k); return v != null && String(v).trim() !== '' ? String(v).trim() : null; };
  const priorityKey = value => String(value == null ? '' : value).trim().replace(/^P/i, '').replace(/[.,]/g, '_').toUpperCase();
  const activePriorityKey = priorityKey(get('prioridade'));
  const prioridadeEmCurso = prioridadesRealizadas.find(p => priorityKey(p.nome) === activePriorityKey) || null;
  return {
    ativo: !!txt('chave'),
    modelo: mm ? mm[1].trim() : (ml && !/^[-–—]+$/.test(ml) ? ml : ''),
    lote: mm ? mm[2] : null,
    geral: parsePct(get('geral')),
    zonas: Object.fromEntries(ZONAS.map(([, k]) => [k, parsePct(get(k)) || 0])),
    inicio: parseDate(get('inicio')), previsto: parseDate(get('previsto')),
    prioridade: txt('prioridade'), proxima: txt('proxima'),
    prioridadesRealizadas, prioridadeEmCurso,
  };
}

/* Dados de exemplo, usados só quando a folha não é acessível (ex.: pré-visualização). */
function demoData() {
  const t = new Date(); t.setHours(0,0,0,0);
  const off = n => { const d = new Date(t); d.setDate(d.getDate() + n); return d; };
  return {
    PS1: { ativo: true, modelo: 'MWS715 SDS EXD DRD', lote: '26L', geral: 46, zonas: { cuba: 100, estrutura: 62, interior: 20, envolventes: 0 }, inicio: off(-6), previsto: off(3), prioridade: 'Estrutura', proxima: 'Interior' },
    PS2: { ativo: true, modelo: 'MWS500 SDS', lote: '87L', geral: 82, zonas: { cuba: 100, estrutura: 100, interior: 70, envolventes: 58 }, inicio: off(-8), previsto: off(1), prioridade: 'Envolventes', proxima: 'Acabamento' },
    PS3: { ativo: true, modelo: 'MWS300 SD', lote: '12L', geral: 18, zonas: { cuba: 40, estrutura: 30, interior: 0, envolventes: 0 }, inicio: off(-2), previsto: off(7), prioridade: 'Cuba', proxima: 'Estrutura' },
    PS4: { ativo: false, modelo: '', lote: null, geral: 0, zonas: { cuba: 0, estrutura: 0, interior: 0, envolventes: 0 }, inicio: null, previsto: null, prioridade: null, proxima: null },
    PS5: { ativo: false, modelo: '', lote: null, geral: 0, zonas: { cuba: 0, estrutura: 0, interior: 0, envolventes: 0 }, inicio: null, previsto: null, prioridade: null, proxima: null },
  };
}

/* ── render ── */
function renderCol(p, d) {
  const pct = d.geral == null ? 0 : d.geral;
  const c = colorFor(pct);
  const priorityPct = d.prioridadeEmCurso?.percentagem;
  const priorityLabel = d.prioridadeEmCurso?.nome || (d.prioridade && /^\d+(?:[.,]\d+)?$/.test(d.prioridade)
    ? `P${d.prioridade.replace(/[.,]/g, '_')}` : d.prioridade) || '—';
  let prazoHtml;
  if (d.inicio && d.previsto) {
    const today = new Date(); today.setHours(0,0,0,0);
    const total = workDays(d.inicio, d.previsto, true);
    const used = Math.min(total, workDays(d.inicio, today, true));
    const ratio = total > 0 ? Math.min(1, used / total) : 0;
    const pc = ratio >= .9 ? 'var(--red)' : ratio >= .7 ? 'var(--amber)' : 'var(--green)';
    prazoHtml = `
      <div class="row"><span class="k">Prazo</span></div>
      <div class="big-bar"><div style="width:${ratio * 100}%;background:${pc}"></div></div>`;
  } else {
    prazoHtml = `<div class="row"><span class="k">Prazo</span></div><div class="big-bar"><div style="width:0%;background:transparent"></div></div>`;
  }
  return `
    <div class="posto-head">
      <div class="posto">${esc(p.nome)}</div>
      <span class="pill ${d.ativo ? 'on' : 'off'}">${d.ativo ? 'Em curso' : 'Standby'}</span>
    </div>
    <div class="focus">
      <div class="pct" style="color:${d.ativo ? c : 'var(--fg-faint)'}">${pct}<small>%</small></div>
      <div class="model">
        <div class="m">${esc(d.modelo || '—')}</div>
        ${d.lote ? `<div class="l"><span>Lote</span>${esc(d.lote)}</div>` : '<div class="l none">Sem lote</div>'}
      </div>
      <div class="prazo">${prazoHtml}</div>
    </div>
    <div class="secondary">
      <div class="priority-focus">
        <div class="pie" style="--p:${priorityPct == null ? 0 : Math.max(0, Math.min(100, priorityPct))};--c:${colorFor(priorityPct || 0)}"></div>
        <div class="name"><span class="k">Prioridade em curso</span><span class="task">${esc(priorityLabel)}</span></div>
        <span class="value">${priorityPct == null ? '—' : priorityPct}<small>${priorityPct == null ? '' : '%'}</small></span>
      </div>
      <div class="next-priority">
        <span class="k">Próxima prioridade</span>
        <strong class="value">${esc(d.proxima || '—')}</strong>
      </div>
    </div>`;
}

const mainEl = document.getElementById('postos');
POSTOS.forEach(p => { const s = document.createElement('section'); s.className = 'col'; s.id = 'col-' + p.tab; mainEl.appendChild(s); });
const state = {};

function paint(tab) {
  const p = POSTOS.find(x => x.tab === tab);
  document.getElementById('col-' + tab).innerHTML = state[tab] ? renderCol(p, state[tab]) : `<div class="posto">${esc(p.nome)}</div><div class="pct" style="color:var(--fg-faint)">--</div>`;
}

async function refresh() {
  const results = await Promise.allSettled(POSTOS.map(p => loadPosto(p.tab)));
  let okCount = 0;
  results.forEach((r, i) => { if (r.status === 'fulfilled') { state[POSTOS[i].tab] = r.value; okCount++; } });
  if (okCount === 0) {
    const demo = demoData();
    POSTOS.forEach(p => { state[p.tab] = demo[p.tab]; });
  }
  POSTOS.forEach(p => paint(p.tab));
  const srcEl = document.getElementById('src');
  srcEl.classList.toggle('live', okCount > 0);
  document.getElementById('srcTxt').textContent = okCount === POSTOS.length ? 'Ligado à folha · atualiza a cada 20 s'
    : okCount > 0 ? `Ligado a ${okCount} de ${POSTOS.length} postos` : 'Sem ligação à folha · dados de exemplo';
}
refresh();
setInterval(refresh, POLL_MS);

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
}
tick(); setInterval(tick, 1000);
</script>
